server {
    listen 80;
    listen [::]:80;
    server_name investcontrol.org www.investcontrol.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://investcontrol.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.investcontrol.org;

    ssl_certificate /etc/letsencrypt/live/investcontrol.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investcontrol.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://investcontrol.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name investcontrol.org;

    ssl_certificate /etc/letsencrypt/live/investcontrol.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investcontrol.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/investcontrol-org.access.log;
    error_log /var/log/nginx/investcontrol-org.error.log;

    # The old /mcp endpoint belongs to a different project and is intentionally
    # out of scope for this hostname migration.
    location = /mcp {
        default_type text/plain;
        return 404 "Not found\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
