server {
    listen 80;
    listen [::]:80;
    server_name xn--b1aghkfidhbthmd7l.xn--p1ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--b1aghkfidhbthmd7l.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--b1aghkfidhbthmd7l.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1aghkfidhbthmd7l.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/invest-control.access.log;
    error_log /var/log/nginx/invest-control.error.log;

    # TODO: Choose the new MCP origin or a temporary old-server proxy before
    # changing production DNS. The same public host currently owns this route.
    location = /mcp {
        default_type text/plain;
        return 503 "MCP migration target is not configured yet\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
